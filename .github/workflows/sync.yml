name: 每日核查

on:
  schedule:
    - cron: "17 21 * * *" # UTC 21:17 = 北京时间 05:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: 校验登记表
        run: python scripts/modindex.py check

      - name: 拉元数据并重生成 README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/modindex.py all

      - name: 有变化才提交
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 每日核查更新 mod 元数据（$(date -u +%F)）"
          git push
