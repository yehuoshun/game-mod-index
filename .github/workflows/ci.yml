name: 校验

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: 登记表语法与字段
        run: python scripts/modindex.py check

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: README 是否与数据一致
        run: python scripts/modindex.py render --check
